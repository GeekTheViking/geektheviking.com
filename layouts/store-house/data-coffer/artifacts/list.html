{{ define "main" }}
<link rel="stylesheet" href="/css/data-coffer.css">

<div class="dv-hero">
  <h1>ARTIFACTS</h1>
  <p class="fx-section-desc">Physical relics from the digital frontier.</p>
</div>

<div class="dv-single-column">
  {{ $art := .Site.GetPage "section" "store-house/data-coffer/artifacts" }}
  {{ if $art }}
    {{ range $art.RegularPages }}
    <article class="dv-item-full">
      <h3 class="dv-item-title">{{ .Title }}</h3>
      <div class="dv-item-body">
        {{ .Content }}
      </div>
    </article>
    {{ end }}
  {{ else }}
    <p>No artifacts yet.</p>
  {{ end }}
</div>
{{ end }}
